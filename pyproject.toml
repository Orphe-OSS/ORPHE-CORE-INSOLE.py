[project]
name = "orphe-core-insole"
version = "0.1.0"
description = "ORPHE CORE / ORPHE INSOLE を Python（bleak）で扱う SDK"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Tetsuaki BABA and ORPHE Inc." }]
dependencies = ["bleak>=0.22"]

[project.scripts]
orphe-core-insole = "orphe_core_insole.cli:main"

[project.optional-dependencies]
examples = ["matplotlib", "python-osc"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["orphe_core_insole*"]
